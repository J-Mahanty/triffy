services:
  bot:
    build: .
    command: ["python", "discordBot/main.py"]
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - SERVER_BOT_TOKEN
      - CHANNEL_ID
      - REDIS_HOST
      - REDIS_PORT
      - TRIFFY_CITY
      - TRIFFY_MAP_BASE

  web:
    build: .
    command: ["python", "-m", "route_engine.api"]
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "${APP_PORT:-42069}:${WEB_PORT:-42069}"
    environment:
      - TRIFFY_HOST=0.0.0.0
      - TRIFFY_PORT=${WEB_PORT:-42069}
      - TRIFFY_READONLY
      - REDIS_HOST
      - REDIS_PORT
      - TRIFFY_CITY
      - TRIFFY_MAP_BASE

  redis:
    image: redis:alpine