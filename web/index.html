<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triffy — routes that do not lie to you</title>
<link rel="preload" href="/static/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<!-- Leaflet is vendored rather than pulled from a CDN, so the app still runs
     in a room with no internet (map tiles will not load there, but routing
     and the traffic layer will). -->
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-mode="sim">

<!-- One icon system: 24px grid, 1.75px round stroke, currentColor. -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M14.5 4.5v15"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><rect x="3" y="7" width="12" height="10" rx="2"/><path d="M15 10.5l5-3v9l-5-3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5L2.5 20h19z"/><path d="M12 10v4.5M12 17.2v.1"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.1"/></symbol>
    <symbol id="i-step-start" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="8"/></symbol>
    <symbol id="i-step-straight" viewBox="0 0 24 24"><path d="M12 20V4M6.5 9.5L12 4l5.5 5.5"/></symbol>
    <symbol id="i-step-left" viewBox="0 0 24 24"><path d="M18 20v-7a4 4 0 0 0-4-4H5M9 5L5 9l4 4"/></symbol>
    <symbol id="i-step-right" viewBox="0 0 24 24"><path d="M6 20v-7a4 4 0 0 1 4-4h9M15 5l4 4-4 4"/></symbol>
    <symbol id="i-step-bear-left" viewBox="0 0 24 24"><path d="M15 20v-6.5L7 5.5M7 11V5.5h5.5"/></symbol>
    <symbol id="i-step-bear-right" viewBox="0 0 24 24"><path d="M9 20v-6.5l8-8M17 11V5.5h-5.5"/></symbol>
    <symbol id="i-step-arrive" viewBox="0 0 24 24"><path d="M6 21V4M6 4.5h11l-2.5 4 2.5 4H6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
    <symbol id="i-mark" viewBox="0 0 24 24"><path d="M6.5 17.5c0-3.5 2.5-4.5 5.5-5.5s5.5-2 5.5-5.5"/><circle cx="6.5" cy="17.5" r="2.2" fill="currentColor" stroke="none"/><circle cx="17.5" cy="6.5" r="2.2" fill="currentColor" stroke="none"/></symbol>
  </defs>
</svg>

<section id="map" aria-label="Traffic map"></section>

<!-- Plan sheet: the task. -->
<aside class="sheet plan" aria-label="Plan a journey">
  <header class="plan-head">
    <div class="brand">
      <span class="brand-mark"><svg><use href="#i-mark"/></svg></span>
      <span class="brand-name">Triffy</span>
    </div>
    <fieldset class="seg">
      <legend class="sr">Which city</legend>
      <button type="button" data-mode="sim" class="on" aria-pressed="true">Kolkata<small>Simulated</small></button>
      <button type="button" data-mode="live" aria-pressed="false">London<small>Live</small></button>
    </fieldset>
  </header>

  <output class="provenance" id="provenance"></output>
  <p class="city" id="cityLabel">Loading the map…</p>

  <div class="search" id="search">
    <button type="button" class="od-summary" id="odSummary" hidden aria-label="Edit the journey">
      <span class="od-sum-text" id="odSumText"></span>
      <span class="od-sum-edit">Edit</span>
    </button>
    <div class="od">
      <div class="od-rail" aria-hidden="true"><i class="od-dot"></i><i class="od-line"></i><i class="od-pin"></i></div>
      <div class="od-fields">
        <label class="sr" for="origin">From</label>
        <input id="origin" list="places" value="Park Circus" autocomplete="off" placeholder="From">
        <label class="sr" for="dest">To</label>
        <input id="dest" list="places" value="BBD Bagh" autocomplete="off" placeholder="To">
      </div>
      <button type="button" class="icon-btn od-swap" id="swap" aria-label="Swap origin and destination"><svg><use href="#i-swap"/></svg></button>
    </div>
    <datalist id="places"></datalist>

    <div class="opts">
      <div class="field">
        <label for="depart">Leave at</label>
        <input id="depart" placeholder="Now" inputmode="numeric">
      </div>
      <div class="field">
        <label for="arriveBy">Arrive by</label>
        <input id="arriveBy" placeholder="Optional" inputmode="numeric">
      </div>
    </div>

    <div class="field">
      <label for="persona">How are you travelling?</label>
      <select id="persona"></select>
      <p class="hint" id="personaHint"></p>
    </div>

    <button type="button" id="go" class="btn btn-primary">Find routes</button>
  </div>

  <section id="advisory" class="advisory hidden" aria-live="polite"></section>
  <section id="results" class="results" aria-live="polite"></section>
</aside>

<!-- Status: the time and how traffic looks right now. -->
<div class="status" aria-label="Traffic now">
  <div class="chip clockchip">
    <svg><use href="#i-clock"/></svg>
    <span class="clocklabel" id="clockLabel">Time</span>
    <b class="clock" id="clock">--:--</b>
  </div>
  <div class="kpis" id="kpis"></div>
  <button type="button" class="icon-btn chip-btn" id="drawerToggle" aria-label="Hide the map key" aria-expanded="true" aria-controls="drawer"><svg><use href="#i-panel"/></svg></button>
</div>

<!-- Map key. -->
<aside class="sheet drawer" id="drawer" aria-label="Map key">
  <section class="block legend" id="legendCard">
    <div class="block-head"><h2>Map key</h2></div>
    <ul class="key">
      <li><i class="k-line k-route"></i>Traffic flowing</li>
      <li><i class="k-line t1"></i>Slowing</li>
      <li><i class="k-line t2"></i>Congested</li>
      <li><i class="k-line t3"></i>Near gridlock</li>
      <li><i class="k-line alt"></i>Other routes</li>
      <li class="sim-only"><i class="k-inc"></i>Incident</li>
      <li><i class="k-start"></i>Start</li>
      <li><i class="k-dest"></i>Destination</li>
    </ul>
    <p class="fine">Your route's colours show the traffic expected when you reach each part of it.</p>
  </section>
</aside>

<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
